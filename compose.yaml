name: bdp-course
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/workspace/data:ro
      - ./student.json:/workspace/student.json:ro
      - ./outputs/container:/workspace/outputs
    environment:
      BDP_ROOT: /workspace
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
